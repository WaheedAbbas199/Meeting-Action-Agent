# Local/production-like stack: PostgreSQL + the app. Secrets come from your shell or an .env file (never commit it).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: maa
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maa -d maa"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://maa:${POSTGRES_PASSWORD}@db:5432/maa
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to 32+ random characters}
      LLM_PROVIDER: ${LLM_PROVIDER:-heuristic}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      STT_PROVIDER: ${STT_PROVIDER:-none}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-disabled}
      CALENDAR_PROVIDER: ${CALENDAR_PROVIDER:-disabled}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      GMAIL_SENDER: ${GMAIL_SENDER:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
    volumes: ["uploads:/app/data/uploads"]
volumes:
  pgdata:
  uploads:
